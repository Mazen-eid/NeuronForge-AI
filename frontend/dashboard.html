<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeuronForge AI - Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1 data-i18n="dashboard_title"></h1>
    <nav>
      <ul>
        <li><a href="index.html"><span data-i18n="nav_home"></span></a></li>
        <li><a href="assistant.html"><span data-i18n="nav_assistant"></span></a></li>
      </ul>
    </nav>
    <select id="toggleLang"></select>
  </header>

  <main>
    <section>
      <h2 data-i18n="dashboard_api_status"></h2>
      <p id="api-status" class="status-unknown">—</p>
      <p><small>API: <code id="api-url"></code></small></p>
    </section>

    <section>
      <h2 data-i18n="dashboard_channels"></h2>
      <div id="channels-list"><em data-i18n="loading"></em></div>
    </section>

    <section>
      <h2 data-i18n="dashboard_quick_commands"></h2>
      <label>
        <span data-i18n="dashboard_select_channel"></span>
        <select id="channel-select"></select>
      </label>
      <div class="buttons-row">
        <button id="btn-run-now" data-i18n="dashboard_btn_run_now"></button>
        <button id="btn-dry-run" data-i18n="dashboard_btn_dry_run"></button>
      </div>
    </section>

    <section>
      <h2 data-i18n="dashboard_recent_runs"></h2>
      <table id="runs-table">
        <thead>
          <tr>
            <th data-i18n="runs_col_when"></th>
            <th data-i18n="runs_col_channel"></th>
            <th data-i18n="runs_col_topic"></th>
            <th data-i18n="runs_col_status"></th>
            <th data-i18n="runs_col_url"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="output">
      <h2 data-i18n="dashboard_output"></h2>
      <pre id="output-area" data-i18n="dashboard_output_wait"></pre>
    </section>
  </main>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
