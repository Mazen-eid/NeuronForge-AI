[project]
name = "neuronforge"
version = "0.1.0"
description = "Automated content pipeline: trend discovery -> script -> TTS -> video -> YouTube upload."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "edge-tts>=6.1.12",
  "pytrends>=4.9",
  "feedparser>=6.0",
  "google-api-python-client>=2.110",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
  "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
neuronforge = "neuronforge.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neuronforge*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
